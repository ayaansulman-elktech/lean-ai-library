name: Deploy Next.js site to Pages

on:
  push:
    branches: ["github-pages-configs"] # Listen to the new branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Install dependencies
        run: npm ci
        
      # CRITICAL STEP: Build our Catalog metadata first!
      - name: Build Catalog CLI
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: npm run cli -- build
        
      # Now build the Next.js static site
      - name: Build with Next.js
        run: npx next build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
