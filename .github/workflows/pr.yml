name: Validate PR

on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lean-ai-library
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Catalog via CLI
        run: npm run cli build

      - name: Validate Catalog
        run: npm run cli validate

      - name: Run Tests
        run: npm run cli test

      - name: Next.js Production Build
        run: npm run build
